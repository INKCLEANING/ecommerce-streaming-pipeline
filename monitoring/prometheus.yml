global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "kafka-jmx"
    static_configs:
      - targets: ["kafka-jmx-exporter:5556"]

  - job_name: "producer"
    static_configs:
      - targets: ["producer:8000"]

  - job_name: "consumer"
    static_configs:
      - targets: ["consumer:8001"]
